<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسجيل غير متاح - مركز منابر الأقصى</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('siteTheme');
      if(saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
  })();
</script>
<style>
  :root{
    --navy-deep:#0f172a;
    --blue:#2563eb;
    --blue-soft:#64748b;
    --paper:#ffffff;
    --gold:#c9973f;
    --gold-soft:#e8d4a8;
    --ink:#1e293b;
    --surface:#fff;
    --surface-alt:#f3f7fb;
    --border:#e2e8f0;
    --muted:#94a3b8;
    --heading:var(--navy-deep);
  }
  html[data-theme="dark"]{
    --paper:#0b1220;
    --ink:#e2e8f0;
    --blue-soft:#7f8ea3;
    --surface:#141e30;
    --surface-alt:#111a24;
    --border:#22303f;
    --muted:#64748b;
    --heading:#f1f5f9;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  input,button,textarea,select{ font-family:inherit; font-weight:inherit; }
  html,body{ min-height:100%; font-family:'Cairo','Segoe UI',sans-serif; font-weight:600; background:var(--paper); color:var(--ink); }
  body{
    background:
      radial-gradient(circle at 10% 0%, rgba(201,151,63,0.08), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(37,99,235,0.10), transparent 45%),
      var(--paper);
    min-height:100vh; padding:60px 20px; display:flex; justify-content:center; align-items:center;
  }
  .card{
    width:100%; max-width:460px; background:var(--surface); border-radius:28px;
    box-shadow:0 30px 60px -20px rgba(15,23,42,0.20), 0 10px 24px -12px rgba(15,23,42,0.10);
    border:1px solid var(--border);
    padding:44px 36px; text-align:center;
    animation:rise .5s ease both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
  .badge{
    width:70px; height:70px; border-radius:50%;
    background:linear-gradient(160deg, var(--blue), var(--navy-deep));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:30px; margin:0 auto 20px;
    box-shadow:0 12px 26px -10px rgba(37,99,235,0.4);
  }
  h1{ font-size:21px; color:var(--heading); margin-bottom:10px; }
  p{ font-size:15px; line-height:1.9; color:var(--ink); margin-bottom:22px; }
  .back-btn{
    display:inline-block; padding:15px 30px; border-radius:14px;
    background:var(--blue); color:#fff; text-decoration:none;
    font-size:16px; font-weight:800; transition:background .2s ease, transform .18s ease;
    box-shadow:0 10px 24px -8px rgba(37,99,235,0.4);
  }
  .back-btn:hover{ background:var(--navy-deep); transform:translateY(-2px); }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">🏫</div>
    <h1>التسجيل الذاتي غير متاح</h1>
    <p>
      لم يعد بالإمكان إنشاء حساب طالب جديد من هذه الصفحة. أصبح تسجيل الطلاب الجدد
      يتم حصرياً من قبل إدارة المدرسة. يرجى التواصل مع إدارة المدرسة لتسجيل الطالب
      والحصول على بيانات الدخول الخاصة به.
    </p>
    <a href="index.html" class="back-btn">→ العودة لتسجيل الدخول</a>
  </div>
</body>
</html>
